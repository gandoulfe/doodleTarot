<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Trouvez la date de votre prochaine soirée tarot en un clic.">
<meta name="theme-color" content="#fbfbfd">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>La Table de Tarot — Créer une soirée</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="suits" aria-hidden="true">♠ ♥ ♦ ♣</div>
    <h1>La Table de Tarot</h1>
    <p>Organisez votre prochaine soirée entre atouts et petits jeux.</p>
  </div>

  <div class="card-panel">
    <h2>Nouvelle soirée</h2>
    <label for="ev-name">Nom de la soirée</label>
    <input type="text" id="ev-name" placeholder="Soirée Tarot chez Dédé">

    <label for="ev-desc">Description (optionnel)</label>
    <textarea id="ev-desc" placeholder="Apportez vos jetons et votre bonne humeur !"></textarea>
  </div>

  <div class="card-panel">
    <h2>Dates proposées</h2>
    <p class="hint">Cliquez sur autant de dates que vous voulez.</p>

    <div class="calendar-nav">
      <button type="button" id="cal-prev">‹</button>
      <div class="month-labels">
        <span id="month-label-0"></span>
        <span id="month-label-1"></span>
      </div>
      <button type="button" id="cal-next">›</button>
    </div>

    <div class="calendars">
      <div id="cal-0" class="month-grid"></div>
      <div id="cal-1" class="month-grid"></div>
    </div>

    <div class="selected-dates" id="selected-dates"></div>
  </div>

  <div class="actions">
    <button type="button" class="btn-wine" id="create-btn">Distribuer les cartes</button>
  </div>
  <p class="error" id="error-msg"></p>

  <div class="card-panel" id="my-events-panel" style="display:none;">
    <h2>Toutes les soirées</h2>
    <div id="my-events-list"></div>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <h3>Supprimer cette soirée ?</h3>
    <p class="hint" id="confirm-modal-text">Cette action est définitive, les réponses des joueurs seront perdues.</p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="confirm-cancel">Annuler</button>
      <button type="button" class="btn-danger" id="confirm-ok">Supprimer</button>
    </div>
  </div>
</div>

<script>
function askConfirm(text) {
  return new Promise(resolve => {
    const modal = document.getElementById('confirm-modal');
    document.getElementById('confirm-modal-text').textContent = text;
    modal.classList.add('open');
    const cleanup = (result) => {
      modal.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      modal.removeEventListener('click', onOverlay);
      resolve(result);
    };
    const okBtn = document.getElementById('confirm-ok');
    const cancelBtn = document.getElementById('confirm-cancel');
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    const onOverlay = (e) => { if (e.target === modal) cleanup(false); };
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    modal.addEventListener('click', onOverlay);
  });
}

async function loadMyEvents() {
  const panel = document.getElementById('my-events-panel');
  const list = document.getElementById('my-events-list');

  list.innerHTML = '<div class="page-loader"><span class="spinner"></span>Chargement...</div>';
  panel.style.display = '';

  let events = [];
  try {
    const res = await fetch('/api/events');
    if (res.ok) events = await res.json();
  } catch {}

  if (events.length === 0) { panel.style.display = 'none'; return; }

  list.innerHTML = '';
  events.forEach(ev => {
    const row = document.createElement('div');
    row.className = 'event-row';
    row.innerHTML = `
      <a class="event-row-link" href="/event.html?id=${ev.id}">
        <span class="event-row-name">${escapeHtml(ev.name)}</span>
        <span class="event-row-meta">${ev.date_count} date${ev.date_count > 1 ? 's' : ''} · ${ev.participant_count} joueur${ev.participant_count > 1 ? 's' : ''}</span>
      </a>
      <button type="button" class="btn-remove" data-delete="${ev.id}" title="Supprimer">×</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.delete;
      const ok = await askConfirm('Cette soirée et toutes les réponses associées seront supprimées définitivement.');
      if (!ok) return;
      btn.disabled = true;
      try {
        await fetch(`/api/events/${id}`, { method: 'DELETE' });
        loadMyEvents();
      } catch {
        btn.disabled = false;
      }
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadMyEvents();

const DOW = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const selectedDates = new Set();

let viewYear, viewMonth;
{
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
}

function toISO(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function isPast(y, m, d) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return new Date(y, m, d) < today;
}

function renderMonth(container, y, m) {
  container.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    container.appendChild(el);
  });

  const firstDay = new Date(y, m, 1).getDay();
  const offset = (firstDay + 6) % 7; // lundi = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayISO = toISO(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

  for (let i = 0; i < offset; i++) {
    const el = document.createElement('div');
    el.className = 'day-cell empty';
    container.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const iso = toISO(y, m, d);
    const el = document.createElement('div');
    el.className = 'day-cell';
    el.textContent = d;
    if (iso === todayISO) el.classList.add('today');
    if (isPast(y, m, d) && iso !== todayISO) {
      el.classList.add('past');
    } else {
      if (selectedDates.has(iso)) el.classList.add('selected');
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-pressed', selectedDates.has(iso) ? 'true' : 'false');
      const toggle = () => {
        if (selectedDates.has(iso)) selectedDates.delete(iso);
        else selectedDates.add(iso);
        renderCalendars();
        renderChips();
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    }
    container.appendChild(el);
  }
}

function monthLabel(y, m) {
  return new Date(y, m, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
}

function renderCalendars() {
  const next = viewMonth === 11 ? { y: viewYear + 1, m: 0 } : { y: viewYear, m: viewMonth + 1 };
  document.getElementById('month-label-0').textContent = monthLabel(viewYear, viewMonth);
  document.getElementById('month-label-1').textContent = monthLabel(next.y, next.m);
  renderMonth(document.getElementById('cal-0'), viewYear, viewMonth);
  renderMonth(document.getElementById('cal-1'), next.y, next.m);
}

function renderChips() {
  const container = document.getElementById('selected-dates');
  container.innerHTML = '';
  const sorted = Array.from(selectedDates).sort();
  sorted.forEach(iso => {
    const chip = document.createElement('div');
    chip.className = 'date-chip';
    const label = new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    chip.innerHTML = `<span>${label}</span>`;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.addEventListener('click', () => {
      selectedDates.delete(iso);
      renderCalendars();
      renderChips();
    });
    chip.appendChild(btn);
    container.appendChild(chip);
  });
}

document.getElementById('cal-prev').addEventListener('click', () => {
  if (viewMonth === 0) { viewMonth = 11; viewYear--; } else { viewMonth--; }
  renderCalendars();
});
document.getElementById('cal-next').addEventListener('click', () => {
  if (viewMonth === 11) { viewMonth = 0; viewYear++; } else { viewMonth++; }
  renderCalendars();
});

renderCalendars();
renderChips();

document.getElementById('create-btn').addEventListener('click', async () => {
  const errorEl = document.getElementById('error-msg');
  errorEl.textContent = '';
  const name = document.getElementById('ev-name').value.trim();
  const description = document.getElementById('ev-desc').value.trim();
  const dates = Array.from(selectedDates).sort();

  if (!name) { errorEl.textContent = 'Il faut un nom de soirée.'; return; }
  if (dates.length === 0) { errorEl.textContent = 'Sélectionnez au moins une date.'; return; }

  const btn = document.getElementById('create-btn');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span>Distribution en cours...';

  try {
    const res = await fetch('/api/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description, dates })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || 'Erreur, la donne a mal tourné.';
      return;
    }
    const data = await res.json();
    window.location.href = `/event.html?id=${data.id}`;
  } catch (err) {
    errorEl.textContent = 'Impossible de contacter le serveur.';
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});
</script>
</body>
</html>
